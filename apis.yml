apis:
- name: Willie's Reserve Commerce Agent API (UCP/MCP)
  description: >-
    A live Model Context Protocol server implementing the Universal Commerce Protocol shopping
    service for the Willie's Reserve store. Thirteen tools cover catalog search and lookup, cart
    lifecycle, checkout lifecycle and order retrieval. Discovery and tools/list are anonymous;
    payment requires a buyer-approved instrument and explicit human approval at completion.
