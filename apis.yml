aid: willie-s-reserve
name: Willie's Reserve
description: >-
  Willie's Reserve is the cannabis brand founded around Willie Nelson's name and legacy, selling
  premium cannabis products direct to consumers from williesreserve.com. It is a consumer products
  company rather than a software vendor, and it publishes no developer program, no OpenAPI and no
  SDKs. It does, however, operate a real and unusually complete agent commerce surface: a live,
  anonymously reachable Model Context Protocol endpoint at /api/ucp/mcp implementing the Universal
  Commerce Protocol shopping service, a machine-readable UCP merchant profile at /.well-known/ucp,
  an /agents.md instruction document mirrored at /llms.txt, a dedicated agentic-discovery sitemap,
  and robots.txt policy language requiring human approval before any agent completes a payment.
