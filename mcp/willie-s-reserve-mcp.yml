name: Willie's Reserve Commerce MCP Server (UCP)
slug: willie-s-reserve-mcp
status: live
description: Willie's Reserve serves a live, anonymously reachable Model Context Protocol server at https://williesreserve.com/api/ucp/mcp
  implementing the Universal Commerce Protocol (UCP) shopping service. A tools/list call returned 13 real
  tools with full JSON Schema inputs covering catalog search and lookup, cart lifecycle, checkout lifecycle
  and order retrieval for this store's own product catalog.
ownership:
  note: The endpoint is provisioned by Shopify (serverInfo.name "universal-commerce") but it is store-scoped
    and served from the company's own domain. The UCP merchant profile at /.well-known/ucp names merchant_name
    "Willie's Reserve", merchant_origin "williesreserve.com" and gatewayMerchantId 59591163950 (the same
    shop id the storefront reports), so the surface belongs to this company even though the runtime is
    platform code.
  evidence: https://williesreserve.com/.well-known/ucp
