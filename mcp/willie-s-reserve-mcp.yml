governance:
  human_approval_required: true
  note: Both /llms.txt and /robots.txt state that checkout, payment and order placement must not be completed
    automatically without explicit, contemporaneous human approval; agents transacting on a buyer's behalf
    are directed to UCP/MCP or the Shop skill, both of which require buyer approval before payment.
  source: https://williesreserve.com/robots.txt
prices:
  units: ISO 4217 minor units
  shape: '{"amount": <int>, "currency": "<ISO 4217>"}'
  note: Documented in every tool description; agents must convert to major units before quoting a buyer.
