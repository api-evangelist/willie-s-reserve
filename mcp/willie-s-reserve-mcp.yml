    version: 0.1.0
  server_capabilities:
    tools:
      listChanged: true
    prompts:
      listChanged: true
    resources:
      listChanged: true
    logging: {}
  transport: streamable-http
  content_type: application/json
  accept: application/json, text/event-stream
  method: POST only
  get_behavior: A plain GET on the endpoint returns the storefront's HTML 404 page. The endpoint answers
    only JSON-RPC POSTs; a liveness check that uses GET will read as dead and is wrong.
